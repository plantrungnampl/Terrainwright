name: Bug report
description: Report a reproducible Terrainwright problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Terrainwright. Remove secrets, server addresses, and private world data from logs before attaching them.
  - type: input
    id: terrainwright-version
    attributes:
      label: Terrainwright version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Minecraft, Fabric Loader, Fabric API, and Java versions
      placeholder: Minecraft 26.2; Loader 0.19.3; Fabric API 0.154.2+26.2; Java 25
    validations:
      required: true
  - type: dropdown
    id: side
    attributes:
      label: Where did it happen?
      options:
        - Dedicated server and client
        - Single-player or integrated server
        - Client only
        - Dedicated server only
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Give the smallest sequence that reproduces the problem consistently.
      placeholder: |
        1. Place...
        2. Link...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or crash report
      description: Drag files here after removing credentials and private data.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report does not contain a security vulnerability or private exploit details.
          required: true
